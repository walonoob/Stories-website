<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f2">
  <meta name="description" content="A little application for the Stories team.">
  <title>A Little Application | Stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fff7f2;
      --ink: #1d3029;
      --muted: #58665f;
      --green: #176047;
      --coral: #e26c4e;
      --rose: #c94f68;
      --line: rgba(95, 59, 62, .22);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; margin: 0; background: linear-gradient(rgba(255, 247, 242, .48), rgba(255, 247, 242, .66)), url("stories-front.jpg") center 45% / cover fixed; color: var(--ink); font-family: var(--sans); }
    .wrap { width: min(1080px, calc(100% - 48px)); margin-inline: auto; }
    .masthead, .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .masthead { padding-block: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; border-radius: 3px; padding: 8px 12px; background: #c43f50; color: white; font-family: var(--serif); font-size: 23px; font-weight: 700; white-space: nowrap; }
    .edition { border-radius: 3px; padding: 7px 10px; background: #c43f50; color: white; font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    main { width: min(760px, calc(100% - 48px)); align-self: center; justify-self: center; padding-block: 62px; }
    .question { position: relative; padding: clamp(26px, 6vw, 64px); border: 1px solid var(--line); border-radius: 4px; background: rgba(255, 253, 251, .86); box-shadow: 0 16px 44px rgba(118, 54, 69, .1); backdrop-filter: blur(7px); text-align: center; }
    .heart { position: absolute; top: 18px; right: 23px; color: var(--rose); font-size: 22px; transform: rotate(12deg); }
    .eyebrow { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 20px; color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .eyebrow::before, .eyebrow::after { width: 24px; height: 1px; background: var(--coral); content: ""; }
    h1 { max-width: 620px; margin: 0 auto; color: var(--ink); font-family: var(--serif); font-size: clamp(38px, 6vw, 66px); font-weight: 500; line-height: 1.12; }
    .supporting { max-width: 500px; margin: 18px auto 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .arena { position: relative; min-height: 160px; margin-top: 28px; border-top: 1px solid var(--line); }
    .answer { position: absolute; top: 34px; min-width: 116px; height: 50px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--green); border-radius: 4px; padding: 0 18px; background: var(--green); color: white; font: 700 14px var(--sans); text-decoration: none; cursor: pointer; transition: left .16s ease, top .16s ease, background .16s ease; }
    .answer:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    .yes { left: calc(50% - 128px); }
    .yes:hover { background: #104b36; }
    .no { left: calc(50% + 12px); background: transparent; color: var(--green); }
    .no:hover { background: rgba(217, 104, 125, .08); }
    .response { min-height: 0; margin: 0; color: var(--rose); font-family: var(--serif); font-size: 20px; line-height: 1.5; }
    .response:not(:empty) { padding-top: 18px; }
    .foot { padding-block: 18px; border-top: 1px solid var(--line); color: #4f5d56; font-size: 12px; }

    @media (max-width: 520px) {
      .wrap { width: calc(100% - 32px); }
      .masthead { padding-block: 18px; }
      .brand { padding: 6px 8px; font-size: 20px; }
      .edition { font-size: 11px; }
      main { width: calc(100% - 32px); padding-block: 36px; }
      .question { padding: 36px 22px; }
      h1 { font-size: clamp(36px, 10vw, 48px); }
      .supporting { font-size: 15px; }
      .arena { min-height: 154px; }
      .answer { min-width: 104px; height: 48px; font-size: 13px; }
      .yes { left: calc(50% - 116px); }
      .no { left: calc(50% + 12px); }
      .response { font-size: 18px; }
      .foot { flex-wrap: wrap; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="masthead wrap">
    <div class="brand">Stories</div>
    <div class="edition">Website idea · 2026</div>
  </header>
  <main>
    <section class="question" aria-labelledby="application-question">
      <span class="heart" aria-hidden="true">♥</span>
      <p class="eyebrow">One little request</p>
      <h1 id="application-question">Would you accept my website innovation for Stories?</h1>
      <p class="supporting">I’ve been building a website idea for Stories and would love to share it with you.</p>
      <div class="arena" id="answer-arena" aria-label="Choose your answer">
        <a class="answer yes" href="stories-whatsapp.html">Yes, let’s talk</a>
        <button class="answer no" id="no-button" type="button">No</button>
      </div>
    </section>
  </main>
  <footer class="foot wrap"><span>Stories · Nairobi</span><span>Thank you for considering my website idea</span></footer>
  <script>
    const arena = document.querySelector("#answer-arena");
    const noButton = document.querySelector("#no-button");
    const yesButton = document.querySelector(".yes");

    function moveNoButton(event) {
      if (event.type === "click") event.preventDefault();

      const maxLeft = Math.max(0, arena.clientWidth - noButton.offsetWidth);
      const maxTop = Math.max(0, arena.clientHeight - noButton.offsetHeight);
      const yesLeft = yesButton.offsetLeft;
      const yesTop = yesButton.offsetTop;
      let left = 0;
      let top = 0;

      for (let attempt = 0; attempt < 20; attempt += 1) {
        left = Math.round(Math.random() * maxLeft);
        top = Math.round(Math.random() * maxTop);
        const overlapsYes = left < yesLeft + yesButton.offsetWidth + 12
          && left + noButton.offsetWidth + 12 > yesLeft
          && top < yesTop + yesButton.offsetHeight + 12
          && top + noButton.offsetHeight + 12 > yesTop;
        if (!overlapsYes) break;
      }

      noButton.style.left = `${left}px`;
      noButton.style.top = `${top}px`;
    }

    noButton.addEventListener("pointerenter", moveNoButton);
    noButton.addEventListener("focus", moveNoButton);
    noButton.addEventListener("click", moveNoButton);
    noButton.addEventListener("touchstart", moveNoButton, { passive: true });
  </script>
</body>
</html>
